id: draft-plan
persona: plan-reviewer
title: Draft a continuity plan from an approved PP4 decision
when_to_use: >
  Use ONLY after solution design (PP4) is complete and a human sponsor has signed a
  decision record. Drafts plan steps that quote that record verbatim, evidence-checks
  the draft, and routes it to plan-reviewer + sponsor sign-off. Never run this straight
  from a BIA — the PP4 decision comes first.
stages:
  - id: confirm-decision
    goal: Confirm the approved PP4 decision record exists before a single step is drafted.
    copy_paste_prompt: |
      I am preparing to draft a continuity plan. Here is the approved solution-design
      decision record: [PASTE DECISION RECORD]. Confirm what was decided, who signed it,
      and list what the decision does NOT cover. Do not draft any plan content yet.
    tools_to_use:
      - search
    connector_guidance: Approved corporate environment only.
    do_not_paste: >
      No plan drafting from a BIA alone. If there is no signed PP4 decision record,
      stop — route back to solution design.
    approval_gate: You confirm the decision record is signed and current before drafting starts.
    reviewer_checklist:
      - The decision record carries a decision id and a human signatory.
      - The chosen option(s) in the record match what the sponsor actually approved.
    expected_output: A confirmed decision basis (id, signatory, scope, exclusions).
    cites:
      - pp5-process
      - pp5-minimum_controls
    next: draft-steps
  - id: draft-steps
    goal: Draft plan steps that quote the approved decision — never invent capability.
    copy_paste_prompt: |
      Draft continuity plan steps FROM THIS APPROVED DECISION ONLY: [DECISION RECORD].
      Every step must quote the decision record verbatim as its evidence, name a human
      owner, and state its trigger. Do not accept risk, declare incidents, or add
      capability the decision does not grant. Mark anything uncertain as MISSING for
      human completion.
    tools_to_use:
      - get_prompt_template
    connector_guidance: Approved corporate environment only — this is live plan content.
    do_not_paste: Public tools are not suitable for live continuity plans.
    approval_gate: You review the draft for steps that exceed the approved decision.
    reviewer_checklist:
      - Every step quotes the decision record.
      - Every step has a named human owner and a trigger.
      - No step accepts risk or declares an incident — those stay human-only.
    expected_output: A draft plan (steps with owner, trigger, decision-record quotes).
    cites:
      - pp5-methods
      - pp5-typical_uses
    next: evidence-check
  - id: evidence-check
    goal: Machine-check the draft — every quote verified against the decision record.
    copy_paste_prompt: |
      Cross-check this draft plan against the decision record. Flag: any step whose
      evidence quote is not verbatim from the record; any step without an owner; any
      risk-acceptance or incident-declaration language. List defects only — do not fix
      silently.
    tools_to_use:
      - search
    connector_guidance: ""
    do_not_paste: Keep the check inside the environment used for drafting.
    approval_gate: All flagged defects are fixed and re-checked before review.
    reviewer_checklist:
      - Zero fabricated quotes remain.
      - Human-only decisions are absent from every step.
    expected_output: A defect list, then a clean re-checked draft.
    cites:
      - faq-how-do-i-use-ai-to-review-a-continuity-plan
      - pp5-minimum_controls
    next: review-and-signoff
  - id: review-and-signoff
    goal: Human review — plan-reviewer and sponsor approve before the plan exists.
    copy_paste_prompt: |
      Prepare the reviewer pack for this draft plan: the decision record it is based on,
      the step list with owners, the open MISSING items, and the questions a reviewer
      should ask. The plan remains DRAFT until the reviewer and sponsor approve.
    tools_to_use:
      - search
    connector_guidance: ""
    do_not_paste: Do not distribute the draft outside the review group.
    approval_gate: >
      The plan-reviewer and the sponsor approve. AI drafts; humans own the plan. An
      unapproved draft is never exercised or invoked.
    reviewer_checklist:
      - Owners have accepted their steps.
      - The sponsor's decision is fully and faithfully reflected.
      - Review cadence and exercise follow-up are scheduled.
    expected_output: An approved (or returned-for-rework) continuity plan with sign-off record.
    cites:
      - pp5-outcomes
      - faq-can-ai-update-my-bcp-automatically
    next: null
